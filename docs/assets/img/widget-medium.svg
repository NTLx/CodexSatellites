<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 360" role="img" aria-labelledby="title desc">
  <title id="title">Medium CodexSatellites widget</title>
  <desc id="desc">Representative Medium widget showing five-hour and weekly remaining quota, reset times, reset count, and app running status.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#393939"/>
      <stop offset="0.5" stop-color="#313131"/>
      <stop offset="1" stop-color="#292828"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="692" height="328" rx="48" fill="url(#surface)" stroke="#686868" stroke-opacity="0.72" filter="url(#shadow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    <text x="54" y="75" fill="#b5b5b5" font-size="21" font-weight="600">Codex</text>

    <g transform="translate(208 151)">
      <circle r="52" fill="none" stroke="#777" stroke-opacity="0.34" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="99 1" transform="rotate(-90)"/>
      <circle cy="-52" r="5" fill="#c8c8c8" fill-opacity="0.55"/>
      <circle cy="52" r="5" fill="#d7d7d7" fill-opacity="0.78"/>
      <text y="13" text-anchor="middle" fill="#dedede" font-size="38" font-weight="500" font-variant-numeric="tabular-nums">99%</text>
    </g>
    <text x="208" y="234" text-anchor="middle" fill="#a8a8a8" font-size="20" font-weight="600">5-hour</text>
    <text x="208" y="261" text-anchor="middle" fill="#686868" font-size="17" font-weight="600">Reset in 4 hr.</text>

    <g transform="translate(516 151)">
      <circle r="52" fill="none" stroke="#777" stroke-opacity="0.34" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100 0" transform="rotate(-90)"/>
      <circle cy="-52" r="5" fill="#c8c8c8" fill-opacity="0.55"/>
      <circle cy="52" r="5" fill="#d7d7d7" fill-opacity="0.78"/>
      <text y="13" text-anchor="middle" fill="#dedede" font-size="38" font-weight="500" font-variant-numeric="tabular-nums">100%</text>
    </g>
    <text x="516" y="234" text-anchor="middle" fill="#a8a8a8" font-size="20" font-weight="600">Weekly</text>
    <text x="516" y="261" text-anchor="middle" fill="#686868" font-size="17" font-weight="600">Reset in 1 wk.</text>

    <text x="54" y="306" fill="#686868" font-size="19" font-weight="600">Reset 3</text>
    <circle cx="574" cy="297" r="8" fill="#6d6d6d"/>
    <text x="590" y="306" fill="#686868" font-size="19" font-weight="600">Running</text>
  </g>
</svg>
