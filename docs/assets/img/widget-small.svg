<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Small CodexSatellites widget</title>
  <desc id="desc">Representative Small widget showing five-hour and weekly remaining quota, reset count, and app running status.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#393939"/>
      <stop offset="0.5" stop-color="#313131"/>
      <stop offset="1" stop-color="#292828"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="328" height="328" rx="48" fill="url(#surface)" stroke="#686868" stroke-opacity="0.72" filter="url(#shadow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    <text x="52" y="75" fill="#b5b5b5" font-size="21" font-weight="600">Codex</text>

    <g transform="translate(112 164)">
      <circle r="52" fill="none" stroke="#777" stroke-opacity="0.34" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="99 1" transform="rotate(-90)"/>
      <circle cy="-52" r="5" fill="#c8c8c8" fill-opacity="0.55"/>
      <circle cy="52" r="5" fill="#d7d7d7" fill-opacity="0.78"/>
      <text y="13" text-anchor="middle" fill="#dedede" font-size="38" font-weight="500" font-variant-numeric="tabular-nums">99%</text>
    </g>
    <text x="112" y="246" text-anchor="middle" fill="#a8a8a8" font-size="20" font-weight="600">5-hour</text>

    <g transform="translate(246 164)">
      <circle r="52" fill="none" stroke="#777" stroke-opacity="0.34" stroke-width="10"/>
      <circle r="52" fill="none" stroke="#f2f2f2" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100 0" transform="rotate(-90)"/>
      <circle cy="-52" r="5" fill="#c8c8c8" fill-opacity="0.55"/>
      <circle cy="52" r="5" fill="#d7d7d7" fill-opacity="0.78"/>
      <text y="13" text-anchor="middle" fill="#dedede" font-size="38" font-weight="500" font-variant-numeric="tabular-nums">100%</text>
    </g>
    <text x="246" y="246" text-anchor="middle" fill="#a8a8a8" font-size="20" font-weight="600">Weekly</text>

    <text x="52" y="306" fill="#686868" font-size="19" font-weight="600">Reset 3</text>
    <circle cx="212" cy="297" r="8" fill="#6d6d6d"/>
    <text x="228" y="306" fill="#686868" font-size="19" font-weight="600">Running</text>
  </g>
</svg>
